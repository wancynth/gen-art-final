<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js">
</script>

<style>
  @font-face {
    font-family: "Monospace-Typewriter";
    src: url("MonospaceTypewriter.ttf") format("truetype");
  }
  
  body {
    background: black;
    font-family: "Monospace-Typewriter";
  }
  
  p {
    text-align: center;
    font-size: min(3vw, 21pt);
    color: white;
  }
  
  #objectives {
    align-content: center;
    top: 0;
/*     background: red; */
    height: 20vh;
  }
  
  .popup-text {
    color: red;
    text-decoration: underline red;
    cursor: pointer;
  }
  
  #rest-text

</style>

<section id="objectives">
  <p>i have so much work to do</p>
  <p id="rest-text">but i'm so tired, i want to <span class="popup-text">rest</span></p>
</section>

<script>
  /*global nn*/
  let canvas, bpm, bpmUp, w, poop, popupText, delay, heart
  let restStatement = 1
  let restStatements = ["i think i'll die if i don't", "i need to", "i want to have", "when will this", "i'm so"]
  let restWords = ["sleep", "relax", "fun", "end", "tired"]
  let workStatements = ["i have to keep", "but i need all my work to be", "there is no"]
  let workWords = ["working", "done", "end"]
  let popupWords = ["if", "this", "is", "how", "it", "is", "now", "then", "will", "it", "ever", "get", "better", "or", "will", "it", "be", "miserable", "forever"]
  let autoPopup = ["⌫","","❝","¶","ﮩ٨ـﮩﮩ٨ـ♡ﮩ٨ـﮩﮩ٨ـ","𝜗𝜚⋆₊˚", "ḁ̶̡͇͍̼̭͕͉̱̻͔̬͉̩ͤ̀̒̇ͮͫ͆ͥͦ̿̓ͨ͌̎ͥ̿̀̓͟ţ̶̵̶̢̢̨̛̛̛̦̲͎͓͖͕̲̤͔̓͒ͦ̔ͪͦ̋ͪͤ̿ͧ̎̊̀̃́̆ͥ͗̈͘͟͡ 4̶̢̢̢̛̘̯̹̦̣̥͇̣̞͎̼̫̭͋̑̉ͪ̊̾͑͆̇ͤ́́̊ͣ̃̾̆͗ͣ̅́͂̃͝͡͡͡ͅͅ a̙̩̅m"]//put images here
  let dx = 30
  let spikes = []
  let l1x1Var
  
  // let offset
  
  class Spike {
    constructor () {
      this.offset = (20000 / Math.pow(bpm, 1.2))
      
      this.l1x1 = l1x1Var
      this.l1y1 = canvas.height/2
      this.l1x2 = this.l1x1 + 10
      this.l1y2 = 20
      
      this.l2x1 = this.l1x2
      this.l2y1 = this.l1y2
      this.l2x2 = this.l2x1 + 10
      this.l2y2 = canvas.height - 20
      
      this.l3x1 = this.l2x2
      this.l3y1 = this.l2y2
      this.l3x2 = this.l3x1 + 10
      this.l3y2 = canvas.height/2
      
      this.o1x1 = this.l3x2
      this.o1y1 = canvas.height/2
      this.o1x2 = this.l3x2 + this.offset
      this.o1y2 = canvas.height/2

    }
    
    update () {
      this.l1x1 -= dx
      this.l1x2 -= dx
      this.l2x1 -= dx
      this.l2x2 -= dx
      this.l3x1 -= dx
      this.l3x2 -= dx
      
      this.o1x1 = this.l3x2
      this.o1x2 = this.o1x1 + (20000 / Math.pow(bpm, 1.2))
    }
  }
  
  function setup() {
    canvas = nn.create('canvas')
      .css('border', 'white 1px solid')
      .position(50,nn.height/4)
      .resize(nn.width-100, nn.height/2-50)
      .addTo('body')
    canvas.strokeColor = 'white'
    canvas.fillStyle = 'transparent'
   
    nn.getAll('.popup-text').forEach(setUpClicks)
    
    bpm = 70
    bpmUp = 5
    
    heartbeatDiv = nn.create('div').css({
            display: 'flex',
            position: 'absolute',
            height: "min(20vw, 16vh, 100pt)", width: "60vw",
            alignContent: 'center',
            justifyContent: 'center',
            justifySelf: 'center',
            bottom: 50,
            margin: 2,
            // background: 'red'
    }).addTo('body')
    heart = nn.create('p').content("❤︎⁠").css({
            justifySelf: 'center',
            fontSize: "min(20vw, 16vh, 64pt)",
            bottom: 20,
            margin: 2
            }).addTo(heartbeatDiv)
    poop = nn.create('p').set("id",'heartrate').content(`${Math.round(bpm)}`).addTo(heartbeatDiv)
            .css({
            justifySelf: 'center',
            fontSize: "min(25vw, 19vh, 72pt)",
            bottom: 20,
            // background: 'red', 
            margin: 2
            })
    console.log(poop)
    delay = 6000
    autoBPM()
    setTimeout(autoDecrease, 3000)
  }
  
  function addSpike() {
    console.log('new spike added')
    offset = 20000 / Math.pow(bpm, 1.2)
    console.log('bpm', bpm)
    console.log('offset', offset)
  
    if (spikes.length === 0) {
      console.log('condition1')
      l1x1Var = canvas.width
    }
    else if (spikes.length >= 1){
      console.log('l1x1Var before', l1x1Var)
      console.log('condition2')
      const lastSpike = spikes[spikes.length - 1]
      console.log(lastSpike)
      l1x1Var = lastSpike.o1x2
      console.log(l1x1Var)
    }
    const s = new Spike()
    spikes.push(s)
    console.log(s.l1x1, s.l3x2, l1x1Var)
  }
  
  function draw() {
    canvas.fillStyle = nn.rgb(0, 0, 0)
    canvas.rect(0, 0, canvas.width, canvas.height)
    spikes.forEach(sp => sp.update())
    addSpike()
    let spikeFPS = (60/bpm) * 1000
    console.log(spikeFPS)
    setTimeout(draw, spikeFPS)
    if (spikes[0].l3x2 <= 0){
      spikes.shift()}
    spikes.forEach(sp => {
      sp.update()
      canvas.line(sp.l1x1, sp.l1y1, sp.l1x2, sp.l1y2)
      canvas.line(sp.l2x1, sp.l2y1, sp.l2x2, sp.l2y2)
      canvas.line(sp.l3x1, sp.l3y1, sp.l3x2, sp.l3y2)
      canvas.line(sp.o1x1, sp.o1y1, sp.o1x2, sp.o1y2)
      console.log('offsetvalue',sp.o1x2 - sp.o1x1)
  })
    //add flashing background that corresponds with heartrate?
  }
  
  function setUpClicks(ele) {
    ele.on('click', changeBPM)
  }
  
  function changeBPM() {
    console.log(this.id)
    let restIndex = Math.round(nn.random(restStatements.length - 1))
    let workIndex = Math.round(nn.random(workStatements.length - 1))
    console.log(restIndex, workIndex)
    if (restStatement === 1){
      if (bpm > 60) {
        bpm -= Math.round(nn.random(1,10))
      }
      restStatement = -1
      nn.get('#rest-text').content(`${workStatements[workIndex]} `).append(nn.create('span')
                                                             .set('class','popup-text')
                                                             .content(`${workWords[workIndex]}`))
      nn.getAll('.popup-text').forEach(setUpClicks)
    } else {
      bpm += Math.round(nn.random(2+bpmUp, 6+bpmUp))
      bpmUp += 1
      restStatement = 1
      nn.get('#rest-text').content(`${restStatements[workIndex]} `).append(nn.create('span')
                                                             .set('class','popup-text')
                                                             .content(`${restWords[workIndex]}`))
      nn.getAll('.popup-text').forEach(setUpClicks)
    }
    poop.content(`${Math.round(bpm)}`)
    const windowFeatures = `left=${Math.round(nn.random(100, 800))},top=${Math.round(nn.random(100, 500))},width=320,height=320,popup=yes`;
    w = window.open("","popup",windowFeatures)
    let popupHTML = `<style>body {background: black; align-content:center} p {text-align:center; font-size: 48pt;color:red}</style><>${nn.random(popupWords)}</p>`
    w.document.body.innerHTML = popupHTML
    setTimeout(close, 300)
    checkBPM()
  }
  
  function close() {
    w.close()
  }
  
  function checkBPM() {
    if (bpm >= 150){
      nn.get("#heartrate").css({color: "red"})
      nn.get(heart).css({color: "red"})
    }
    else {
      nn.get("#heartrate").css({color: "white"})
      nn.get(heart).css({color: "white"})
    }

    if (bpm >= 250) {
      window.close()
    }
    
    checkBPM()
  }
  
  function autoBPM() {
    delay -= 50
    const windowFeatures = `left=${Math.round(nn.random(100, 800))},top=${Math.round(nn.random(100, 500))},width=320,height=320,popup=yes`;
    w = window.open("","popup",windowFeatures)
    let popupHTML = `<style>body {background: white; align-content:center} p {text-align:center; font-size: 48pt;color:black}</style><p>${nn.random(autoPopup)}</p>`
    w.document.body.innerHTML = popupHTML
    setTimeout(close, 300)
    
    console.log(delay)
    setTimeout(autoBPM, delay)
  }
  
  function moveBPM() {
    bpm += 0.6
    poop.content(`${Math.round(bpm)}`)
    checkBPM()
  }
  
  function autoDecrease() {
    setTimeout(autoDecrease, 1500)
    if (!nn.mouseMove){
      if (bpm > 60) {
         bpm -= 0.5
      }
      poop.content(`${Math.round(bpm)}`)
      checkBPM()
    }
  }
  
  function resize () {
    canvas.resize(nn.width-100, nn.height/2-50)
  }
  
  nn.on('load', setup)
  nn.on('resize', resize)
  nn.on('load', draw)
  nn.on('mousemove', moveBPM)
</script>
