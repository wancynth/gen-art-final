<section id="objectives">
  <p>i have so much <span class="popup-text">work</span> to do</p>
  <p>but i'm so tired, i want to <span class="popup-text">rest</span></p>
</section>

<script>
  /*global nn*/
  let canvas, dx, bpm, w
  
  class Spike {
    constructor () {
      this.l1x1 = 0
      this.l1y1 = 0
      this.l1x2 = 0
      this.l1y2 = 0
      
      this.l2x1 = 0
      this.l2y1 = 0
      this.l2x2 = 0
      this.l2y2 = 0
      
      this.l3x1 = 0
      this.l3y1 = 0
      this.l3x2 = 0
      this.l3y2 = 0
    }
    
    update () {
      this.l1x1 += dx
      this.l1x2 += dx
      this.l2x1 += dx
      this.l2x2 += dx
      this.l3x1 += dx
      this.l3x2 += dx
    }
  }
  
  function setup() {
    canvas = nn.create('canvas')
      .css('border', 'white 1px solid')
      .position(50,nn.height/4)
      .resize(nn.width-100, nn.height/2-50)
      .addTo('body')
    canvas.strokeColor = 'white'
    canvas.fillStyle = 'transparent'
    
    nn.getAll('.popup-text').forEach(setUpClicks)
    
    bpm = 70
  }
  
  function draw() {
    canvas.line(0, canvas.height/2, canvas.width/2, canvas.height/2)
    console.log(canvas.height, canvas.width)
    console.log(nn.height, nn.width)
  }
  
  function setUpClicks(ele) {
    ele.on('click', increase)
  }
  
  function increase() {
    bpm += 5
    const windowFeatures = "left=100,top=100,width=320,height=320,popup=yes";
    w = window.open("","popup", windowFeatures)
    setTimeout(close, 10000)
  }
  
  function close() {
    w.close()
  }
  
  function resize () {
    canvas.resize(nn.width-100, nn.height/2-50)
  }
  
  nn.on('load', setup)
  nn.on('resize', resize)
  nn.on('load', draw)
</script>
